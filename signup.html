
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel | Sign Up</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-image signup-image">
            <div class="image-content">
                <h1>Explore the World</h1>
                <p>Your next adventure starts here.</p>
            </div>
        </div>

        <div class="form-container">

            <div class="form-box">

                <h2>Create Account</h2>
                <p class="subtitle">Join us and start your journey!</p>

                <form id="signupForm" novalidate>

                    <div class="mb-3">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullname"
                               placeholder="Enter your full name">
                        <small class="error" id="fullnameError"></small>
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="signupEmail"
                               placeholder="example@mail.com">
                        <small class="error" id="signupEmailError"></small>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone"
                               placeholder="10 digit phone number" maxlength="10">
                        <small class="error" id="phoneError"></small>
                    </div>

                    <div class="mb-3">
                        <label for="city" class="form-label">Location / City</label>
                        <input type="text" class="form-control" id="city"
                               placeholder="Enter your city">
                        <small class="error" id="cityError"></small>
                    </div>

                    <div class="mb-3">
                        <label for="signupPassword" class="form-label">Password</label>
                        <div class="password-box">
                            <input type="password" class="form-control"
                                   id="signupPassword" placeholder="Create password">
                            <button type="button" class="toggle-password"
                                    data-target="signupPassword">Show</button>
                        </div>
                        <small class="error" id="signupPasswordError"></small>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <div class="password-box">
                            <input type="password" class="form-control"
                                   id="confirmPassword" placeholder="Confirm password">
                            <button type="button" class="toggle-password"
                                    data-target="confirmPassword">Show</button>
                        </div>
                        <small class="error" id="confirmPasswordError"></small>
                    </div>

                    <button type="submit" class="btn submit-btn w-100">
                        Create Account
                    </button>

                </form>

                <p class="switch-page">
                    Already have an account?
                    <a href="SignIn.html">Sign In</a>
                </p>

            </div>

        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
